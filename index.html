<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahul Yadav | Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --glass-bg: rgba(255,255,255,0.14);
    --glass-bg-strong: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.35);
    --text-white: #ffffff;
    --text-sub: rgba(255,255,255,0.85);
  }

  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }

  html,body{ height:100%; margin:0; }

  html{
    background: radial-gradient(circle at 25% 10%, #b9b9c9 0%, #c19a68 20%, #d98a3d 40%, #e07a3f 55%, #b98f8f 72%, #9a9aa8 100%);
    background-attachment: fixed;
    background-size: cover;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(24px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes floatOrb{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-20px) scale(1.08); }
  }

  @keyframes gentleBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }

  body{
    font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:36px 20px 48px;
    background: transparent;
    position:relative;
    overflow-x:hidden;
    box-sizing:border-box;
  }

  /* subtle floating orbs for depth, Apple-esque ambient blur */
  body::before, body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    z-index:0;
    pointer-events:none;
  }
  body::before{
    width:280px; height:280px;
    background:#f2c078;
    top:-60px; left:-60px;
    animation: floatOrb 9s ease-in-out infinite;
  }
  body::after{
    width:320px; height:320px;
    background:#e07a3f;
    bottom:-80px; right:-60px;
    animation: floatOrb 11s ease-in-out infinite reverse;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-sizing:border-box;
    padding:0 4px;
  }

  /* Frosted glass profile card */
  .profile-card{
    width:100%;
    background:var(--glass-bg);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:28px;
    padding:36px 28px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.4);
    margin-bottom:22px;
    opacity:0;
    animation: fadeUp 0.7s cubic-bezier(.2,.8,.2,1) 0.1s forwards;
  }

  .avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    overflow:hidden;
    border:2.5px solid rgba(255,255,255,0.6);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    margin-bottom:18px;
    animation: gentleBob 5s ease-in-out infinite;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .name{
    color:var(--text-white);
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 6px;
    text-align:center;
  }

  .tagline{
    color:var(--text-sub);
    font-size:14.5px;
    font-weight:500;
    margin:0;
    text-align:center;
    letter-spacing:0.01em;
    line-height:1.4;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:24px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    background:var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    color:var(--text-white);
    text-decoration:none;
    text-align:center;
    font-size:16px;
    font-weight:600;
    letter-spacing:-0.01em;
    padding:18px 22px;
    border-radius:20px;
    border:1px solid var(--glass-border);
    box-shadow:
      0 4px 18px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1), background 0.2s ease, box-shadow 0.2s ease;
    cursor:pointer;
    overflow:hidden;
    opacity:0;
    animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .links .link-btn:nth-child(1){ animation-delay: 0.16s; }
  .links .link-btn:nth-child(2){ animation-delay: 0.22s; }
  .links .link-btn:nth-child(3){ animation-delay: 0.28s; }
  .links .link-btn:nth-child(4){ animation-delay: 0.34s; }
  .links .link-btn:nth-child(5){ animation-delay: 0.40s; }
  .links .link-btn:nth-child(6){ animation-delay: 0.46s; }
  .links .link-btn:nth-child(7){ animation-delay: 0.52s; }

  .btn-icon{
    width: 21px;
    height: 21px;
    fill: currentColor;
    margin-right: 12px;
    flex-shrink: 0;
  }

  /* subtle top sheen */
  .link-btn::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0));
    pointer-events:none;
  }

  .link-btn:hover{
    background:var(--glass-bg-strong);
    transform:translateY(-3px) scale(1.01);
    box-shadow:
      0 10px 28px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.45);
  }

  .link-btn:active{
    transform:translateY(-1px) scale(0.99);
  }

  .socials{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
    width:fit-content;
    max-width:100%;
    margin:8px auto 32px auto;
    padding:10px 22px;
    background:var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:9999px;
    box-shadow:
      0 4px 18px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.35);
    box-sizing:border-box;
    opacity:0;
    animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 0.60s forwards;
  }

  .socials a{
    width:38px;
    height:38px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:var(--text-white);
    text-decoration:none;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .socials a:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-2px);
  }

  .socials svg{
    width:20px;
    height:20px;
    fill:currentColor;
  }

  @media (prefers-reduced-motion: reduce){
    .link-btn, .socials a{ transition:none; }
  }
</style>
